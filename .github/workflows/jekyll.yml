name: Jekyll Build

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # Pinned: ubuntu-latest (26.04) has no Ruby 3.3.8 build. Unpin when
    # .ruby-version moves to the latest 3.3.x (see www-infra TODO).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
      - name: Install dependencies
        # .bundle/config skips the development/test groups for Cloudflare;
        # CI needs html-proofer, so clear that (CI-only; not committed).
        run: |
          bundle config set --local without ''
          bundle install
      - name: Build site
        run: bundle exec jekyll build
      - name: Archive site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: _site
      - name: HTMLProofer
        env:
          LANG: C.utf8
          LC_ALL: C.utf8
        run: |
          bundle exec htmlproofer ./_site \
            --disable-external \
            --no-enforce-https \
            --ignore-urls "/^\/pio\//"
      - name: Check post permalinks are lowercase
        run: |
          bad=$(grep -rHn '^permalink:' _posts | grep -E ': /news/.*[A-Z]' || true)
          if [ -n "$bad" ]; then
            echo "ERROR: post permalinks must be all-lowercase (URLs are case-sensitive on Cloudflare Pages):"
            echo "$bad"
            exit 1
          fi
          echo "OK: all post permalinks are lowercase"
      - name: Check CV link is a real file
        run: |
          cv_href=$(grep -oP '(?<=href=")[^"]+\.pdf' cara-brook.md | head -1)
          echo "CV link found: $cv_href"
          if [ -z "$cv_href" ]; then
            echo "ERROR: No PDF CV link found in cara-brook.md"
            exit 1
          fi
          cv_file="_site${cv_href}"
          if [ ! -f "$cv_file" ]; then
            echo "ERROR: CV file not found at $cv_file — the link in cara-brook.md is broken"
            exit 1
          fi
          echo "OK: CV file exists at $cv_file"
      - name: Audit gems for known vulnerabilities
        run: |
          gem install bundler-audit
          bundle-audit check --update

  # Merge Dependabot's minor/patch PRs once `build` has passed. Majors stay
  # manual. This job runs only after `build` succeeds, so nothing merges
  # untested even without a branch ruleset. Canonical copy:
  # www-infra/shared/dependabot-automerge-job.yml (appended to each site's
  # build workflow).
  dependabot-automerge:
    needs: build
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
      - name: Merge minor and patch updates
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-minor' ||
          steps.meta.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
